name: Quality Checks

on:
  # NB: pas de `paths-ignore` ici. Une PR qui ne touche que des chemins ignorés
  # (docs/**, .claude/**, *.md) ne déclencherait AUCUN job → les required status
  # checks ne sont jamais rapportés → la branch protection bloque la PR à vie
  # (10 PRs doc bloquées depuis mai 2026). Le workflow tourne donc TOUJOURS ;
  # les jobs coûteux (quality) se court-circuitent en no-op success quand aucun
  # code applicatif n'a changé (voir output `code` de detect-changes). Réf. BO-CI-DOC-PR-CHECKS-001.
  pull_request:
    branches: [main, staging, integration/*]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # 1. Detect which apps changed → skip unchanged apps
  # ----------------------------------------------------------------
  detect-changes:
    name: Contrôles rapides (détection + gardes base)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    outputs:
      back-office: ${{ steps.filter.outputs.back-office }}
      linkme: ${{ steps.filter.outputs.linkme }}
      site-internet: ${{ steps.filter.outputs.site-internet }}
      packages: ${{ steps.filter.outputs.packages }}
      migrations: ${{ steps.filter.outputs.migrations }}
      e2e-needed: ${{ steps.filter.outputs.e2e-needed }}
      # code = true dès qu'un chemin de code applicatif a changé. Sert au job
      # `quality` pour décider s'il fait le build réel ou un no-op success
      # (PR doc-only : code=false → build court-circuité).
      code: ${{ steps.code.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            back-office:
              - 'apps/back-office/**'
              # Déclencher le smoke E2E aussi quand les specs ou la config
              # Playwright changent : sinon une PR qui n'ajoute que des tests
              # passe sans être exécutée (gap observé sur PR #750).
              - 'tests/**'
              - 'playwright.config.ts'
              - 'tests/auth.setup.ts'
            linkme:
              - 'apps/linkme/**'
            site-internet:
              - 'apps/site-internet/**'
            packages:
              - 'packages/**'
              # [BO-AUDIT-004] packages/e2e-linkme ne contient que des tests E2E
              # et n'est consommé par aucune app (vérifié : aucun apps/*/package.json
              # ne le déclare). Sans cette exclusion, modifier une fixture de test
              # déclenchait le build des 3 apps — cause du run de 25 min sur la
              # PR #1128, là où les runs habituels prennent 2 à 6 min.
              - '!packages/e2e-linkme/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'turbo.json'
            migrations:
              - 'supabase/migrations/**'
              - 'packages/@verone/types/src/supabase.ts'
              - 'packages/@verone/types/src/database.ts'
            # e2e-needed = patterns qui justifient un E2E Playwright.
            # Restreint aux fichiers UI / flows critiques afin d'épargner
            # ~10 min de CI sur les PRs purement backend (api/**, integrations,
            # utils, types Supabase régénérés, migrations DB, docs). Voir
            # INFRA-CI-001.
            e2e-needed:
              - 'apps/back-office/src/app/(protected)/**'
              - 'apps/back-office/src/app/(public)/**'
              - 'apps/back-office/src/components/**'
              - 'apps/back-office/middleware.ts'
              - 'apps/back-office/next.config.*'
              - 'apps/back-office/package.json'
              - 'tests/e2e/**'
              - 'tests/auth.setup.ts'
              - 'playwright.config.ts'
              - 'packages/@verone/ui/**'
              - 'packages/@verone/forms/**'
              - 'packages/@verone/finance/**'
              - 'packages/@verone/orders/**'
              - 'packages/@verone/hooks/**'
              - 'pnpm-lock.yaml'

      - name: Compute code-changed flag
        id: code
        run: |
          if [ "${{ steps.filter.outputs.back-office }}" = "true" ] \
            || [ "${{ steps.filter.outputs.linkme }}" = "true" ] \
            || [ "${{ steps.filter.outputs.site-internet }}" = "true" ] \
            || [ "${{ steps.filter.outputs.packages }}" = "true" ] \
            || [ "${{ steps.filter.outputs.migrations }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------------
      # Gardes base de donnees, fusionnees ici en [INFRA-CI-MINUTES-001].
      #
      # Elles vivaient dans trois taches separees (DB FK drift, types
      # Supabase, advisors securite). Leur travail reel : 8 s, 44 s et 13 s.
      # Mais GitHub facture CHAQUE tache arrondie a la minute superieure :
      # trois taches de quelques secondes coutaient 3 minutes pleines par
      # declenchement, soit ~264 minutes par mois d'arrondi pur. Elles
      # refaisaient aussi trois fois le meme checkout et le meme Python.
      #
      # Fusionnees ici : meme travail, memes conditions, une seule minute.
      # --------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg2
        run: pip install psycopg2-binary

      # ---- Garde 1 : derive des cles etrangeres (bloquante) ----
      - name: DB FK drift check
        if: env.SUPABASE_DB_URL != ''
        run: python3 scripts/db-drift-check.py --ci

      - name: Upload drift report
        if: always() && env.SUPABASE_DB_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
          retention-days: 30

      - name: Comment PR on drift failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ DB FK Drift Detected\n\nUne FK a été ajoutée, supprimée ou modifiée sur la DB **sans migration versionnée**.\n\nVoir le [drift report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) téléchargé en artifact.\n\n**Corriger :**\n1. Créer une migration \`supabase/migrations/YYYYMMDD_XXX_description.sql\` qui déclare le changement.\n2. Si le changement en live est intentionnel : ajouter \`DROP CONSTRAINT IF EXISTS ... ADD CONSTRAINT ... ON DELETE <rule>\`.\n3. Ne **pas** modifier une migration existante (règle append-only).\n\nRéférence : ADR-018 dans \`.claude/DECISIONS.md\`.`
            });

      # ---- Garde 2 : types Supabase desynchronises (bloquante) ----
      # Ne tourne QUE si une migration ou supabase.ts a bouge. Sur toute autre
      # PR, rien a verifier : aucune seconde depensee.
      - name: Setup pnpm
        if: steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (needed for @verone/prettier-config)
        if: steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        if: steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Regenerate types from live DB
        if: steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        # La CLI Supabase (>= mi-2026) exige un access token meme avec --db-url,
        # sinon : "Access token not provided" -> fichier genere vide -> faux drift.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript --db-url "$SUPABASE_DB_URL" \
            > packages/@verone/types/src/supabase.ts.generated
          pnpm exec prettier --write packages/@verone/types/src/supabase.ts.generated --parser typescript
          diff -w packages/@verone/types/src/supabase.ts \
            packages/@verone/types/src/supabase.ts.generated \
            > types-drift.diff || true
          if [ -s types-drift.diff ]; then
            echo "❌ Les types Supabase sont désynchronisés du schéma DB."
            echo "Corriger localement : pnpm run generate:types"
            echo ""
            echo "=== Diff (200 premières lignes) ==="
            head -200 types-drift.diff
            exit 1
          fi

      - name: Upload types drift diff on failure
        if: failure() && steps.filter.outputs.migrations == 'true' && env.SUPABASE_DB_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-types-drift
          path: |
            types-drift.diff
            packages/@verone/types/src/supabase.ts.generated
          retention-days: 7

      # ---- Garde 3 : advisors securite Supabase (SECURITY DEFINER, bloquante) ----
      - name: Fetch security advisors
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          python3 scripts/supabase-advisors-check.py --type security \
            --baseline scripts/supabase-advisors-baseline.json \
            --blocking-lints anon_security_definer_function_executable,authenticated_security_definer_function_executable
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::Régression advisors hors SECURITY DEFINER (non bloquant) — voir le commentaire de PR."
            exit 0
          fi
          exit "$code"

      - name: Comment PR with advisors summary
        if: always() && github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              summary = fs.readFileSync('advisors-summary.md', 'utf8');
            } catch (e) {
              summary = '(advisors summary non disponible)';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });

      - name: Note secrets manquants
        if: env.SUPABASE_DB_URL == '' || env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "⚠️ Un secret Supabase manque — la garde correspondante a été sautée." >> $GITHUB_STEP_SUMMARY
          echo "Secrets attendus : SUPABASE_DB_URL, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF." >> $GITHUB_STEP_SUMMARY

  # ----------------------------------------------------------------
  # 2. Quality checks — only on affected apps
  #
  #    [INFRA-CI-BUILD-001] 2026-09-18 — découpé en trois tâches.
  #
  #    Avant : une seule tâche faisait tout, à la file, sur un runner
  #    2 vCPU / 7 Go, dans un budget de 20 minutes :
  #      lint + type-check (2,5 min à chaud, 8,5 min à froid)
  #      + 3 builds Next.js l'un après l'autre (5,7 min à chaud, ~14 à froid)
  #      + 3 passes type-coverage (3,1 min)
  #    À chaud cela tenait en 14 min ; les derniers passages tournaient à
  #    11-19 min, deux fois à 19. Le 2026-09-18 la PR #1175 a débordé :
  #    annulée à 20 min pile, en plein troisième build (run 35359993221).
  #    Un changement dans packages/ invalide le cache des TROIS apps, donc
  #    ce n'est pas un cas rare : c'est le cas de toute PR qui touche un
  #    paquet partagé.
  #
  #    Après : le budget de 20 min ne bouge pas (on ne remonte pas un seuil
  #    pour faire passer la CI, ADR-033). On arrête simplement de faire
  #    séquentiellement ce qui est indépendant :
  #      - quality-lint  : lint + type-check + type-coverage
  #      - quality-build : une tâche PAR application, en parallèle
  #      - quality       : consolide les deux sous le nom historique
  #
  #    Le profil mémoire de chaque build est INCHANGÉ (un seul build par
  #    runner, 6 Go de heap) : la raison qui avait imposé --concurrency=1
  #    en [BO-AUDIT-004] reste respectée. On ne met pas trois builds sur un
  #    runner, on met un build sur chacun des trois runners.
  # ----------------------------------------------------------------
  quality-lint:
    name: Lint + Type-Check + Type Coverage
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.detect-changes.outputs.code == 'true'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- ESLint cache (content-based, invalidated when files change) ----
      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: |
            apps/back-office/.eslintcache
            apps/linkme/.eslintcache
            apps/site-internet/.eslintcache
            packages/@verone/*/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-eslint-

      # ---- TypeScript incremental cache (tsbuildinfo) ----
      - name: Cache tsbuildinfo
        uses: actions/cache@v5
        with:
          path: |
            apps/back-office/tsconfig.tsbuildinfo
            apps/linkme/tsconfig.tsbuildinfo
            apps/site-internet/tsconfig.tsbuildinfo
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('**/tsconfig*.json', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-tsbuildinfo-

      - name: Build filter flags
        id: flags
        run: |
          FILTERS=""
          APPS_CHANGED=""

          if [ "${{ needs.detect-changes.outputs.packages }}" = "true" ]; then
            FILTERS="--filter=@verone/back-office --filter=@verone/linkme --filter=@verone/site-internet"
            APPS_CHANGED="back-office, linkme, site-internet (packages changed)"
          else
            if [ "${{ needs.detect-changes.outputs.back-office }}" = "true" ]; then
              FILTERS="$FILTERS --filter=@verone/back-office"
              APPS_CHANGED="$APPS_CHANGED back-office"
            fi
            if [ "${{ needs.detect-changes.outputs.linkme }}" = "true" ]; then
              FILTERS="$FILTERS --filter=@verone/linkme"
              APPS_CHANGED="$APPS_CHANGED linkme"
            fi
            if [ "${{ needs.detect-changes.outputs.site-internet }}" = "true" ]; then
              FILTERS="$FILTERS --filter=@verone/site-internet"
              APPS_CHANGED="$APPS_CHANGED site-internet"
            fi
          fi

          if [ -z "$FILTERS" ]; then
            FILTERS="--filter=@verone/back-office --filter=@verone/linkme --filter=@verone/site-internet"
            APPS_CHANGED="all (fallback)"
          fi

          echo "filters=$FILTERS" >> $GITHUB_OUTPUT
          echo "apps=$APPS_CHANGED" >> $GITHUB_OUTPUT
          echo "📦 Apps to check: $APPS_CHANGED"

      # ---- Diagnostic du cache distant Turborepo — [BO-AUDIT-004]
      - name: Diagnostic cache Turborepo
        run: |
          if [ -z "$TURBO_TOKEN" ] || [ -z "$TURBO_TEAM" ]; then
            echo "::warning title=Cache Turborepo inactif::TURBO_TOKEN ou TURBO_TEAM manquant. Chaque run recompile tout depuis zéro. Configurer dans Settings > Secrets and variables > Actions."
          else
            echo "✅ Cache distant Turborepo configuré (team: $TURBO_TEAM)"
          fi

      - name: Lint + Type-Check (${{ steps.flags.outputs.apps }})
        run: pnpm turbo run lint type-check ${{ steps.flags.outputs.filters }} --concurrency=100%
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ---- Alignement DB <-> TypeScript — [BO-AUDIT-004] (non bloquant)
      - name: Alignement types DB (informational)
        continue-on-error: true
        run: pnpm validate:types

      # ---- Ecritures DB impossibles — [BO-AUDIT-004] (non bloquant, Lot 005)
      - name: Ecritures DB impossibles (informational)
        continue-on-error: true
        run: pnpm validate:db-usage:ci

      # ---- Type Coverage Gate (baseline-protected) ----
      # Bloque le merge si la couverture de types descend sous le seuil par app.
      # Baselines mesurées 2026-05-09 : back-office 99.22, linkme 99.56, site-internet 98.12
      # [INFRA-CI-BUILD-001] : ces trois passes ne dépendent d'AUCUN build.
      # Elles vivent ici, en parallèle des builds, au lieu de s'ajouter derrière.
      - name: Type Coverage — back-office
        if: needs.detect-changes.outputs.back-office == 'true' || needs.detect-changes.outputs.packages == 'true'
        run: pnpm --filter @verone/back-office type-coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Type Coverage — linkme
        if: needs.detect-changes.outputs.linkme == 'true' || needs.detect-changes.outputs.packages == 'true'
        run: pnpm --filter @verone/linkme type-coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Type Coverage — site-internet
        if: needs.detect-changes.outputs.site-internet == 'true' || needs.detect-changes.outputs.packages == 'true'
        run: pnpm --filter @verone/site-internet type-coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # ----------------------------------------------------------------
  # 2b. Build — une application par runner, les trois en parallèle.
  #     Un seul build par runner, 6 Go de heap : profil mémoire identique
  #     à l'ancien --concurrency=1, mais le temps d'attente devient celui
  #     de l'application la plus lente au lieu de la somme des trois.
  # ----------------------------------------------------------------
  quality-build:
    name: Build ${{ matrix.app }}
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.detect-changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: back-office
            code: bo
          - app: linkme
            code: lm
          - app: site-internet
            code: si
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      # Cette application est-elle concernee ? (packages/ touche => les trois)
      - name: Application concernée ?
        id: scope
        run: |
          if [ "${{ needs.detect-changes.outputs.packages }}" = "true" ] || [ "${{ needs.detect-changes.outputs[matrix.app] }}" = "true" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "✅ ${{ matrix.app }} : build nécessaire"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "⏭️  ${{ matrix.app }} : inchangée, build inutile"
          fi

      - name: Checkout code
        if: steps.scope.outputs.needed == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.scope.outputs.needed == 'true'
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.scope.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      # Meme cle et memes restore-keys qu'avant le decoupage : un changement
      # dans packages/ invalide le cache, le repli rattrape le reste.
      - name: Cache Next.js ${{ matrix.app }}
        if: steps.scope.outputs.needed == 'true'
        uses: actions/cache@v5
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.code }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles(format('apps/{0}/**/*.ts', matrix.app), format('apps/{0}/**/*.tsx', matrix.app), 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.code }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ matrix.code }}-

      - name: Diagnostic cache Turborepo
        if: steps.scope.outputs.needed == 'true'
        run: |
          if [ -z "$TURBO_TOKEN" ] || [ -z "$TURBO_TEAM" ]; then
            echo "::warning title=Cache Turborepo inactif::TURBO_TOKEN ou TURBO_TEAM manquant."
          else
            echo "✅ Cache distant Turborepo configuré (team: $TURBO_TEAM)"
          fi

      - name: Build ${{ matrix.app }}
        if: steps.scope.outputs.needed == 'true'
        run: pnpm turbo run build --filter=@verone/${{ matrix.app }} --concurrency=1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Archive AVANT l'envoi : `upload-artifact` ne preserve pas les liens
      # symboliques, or la sortie autonome de Next reference les paquets par
      # lien vers `node_modules/.pnpm`. Envoyee telle quelle, l'arborescence
      # arrivait amputee et le serveur mourait sur
      # « Cannot find module './cjs/react-dom-server-legacy.node.development.js' ».
      # Un tar conserve les liens. [BO-AUTH-SESSION-002]
      - name: Archive back-office build (for E2E jobs)
        if: matrix.app == 'back-office' && steps.scope.outputs.needed == 'true' && needs.detect-changes.outputs.e2e-needed == 'true'
        run: tar -czf /tmp/back-office-next.tgz -C apps/back-office .next

      - name: Upload back-office .next artifact (for E2E jobs)
        if: matrix.app == 'back-office' && steps.scope.outputs.needed == 'true' && needs.detect-changes.outputs.e2e-needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: back-office-build
          path: /tmp/back-office-next.tgz
          retention-days: 1
          include-hidden-files: true
